<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(
        rgba(15,23,42,.92),
        rgba(15,23,42,.97)
    );

    color:white;

    padding:20px;
}

.container{

    width:100%;

    max-width:500px;
}

.card{

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.15);

    border-radius:20px;

    padding:32px;

    box-shadow:0 25px 50px rgba(0,0,0,.35);

    backdrop-filter:blur(18px);
}

.title{

    text-align:center;

    margin-bottom:28px;
}

.title-icon{

    width:60px;

    height:60px;

    margin:0 auto 15px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:16px;

    background:rgba(56,189,248,.15);

    color:#38bdf8;

    font-size:25px;
}

.title h1{

    font-size:27px;

    margin-bottom:6px;
}

.title p{

    color:#94a3b8;

    font-size:14px;
}

.form-group{

    margin-bottom:19px;
}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

    color:#e2e8f0;
}

input{

    width:100%;

    padding:13px 14px;

    border-radius:10px;

    border:1px solid rgba(255,255,255,.15);

    background:rgba(255,255,255,.08);

    color:white;

    outline:none;

    font-size:14px;
}

input:focus{

    border-color:#38bdf8;

    box-shadow:0 0 12px rgba(56,189,248,.15);
}

input::placeholder{

    color:#94a3b8;
}

.message{

    padding:12px;

    border-radius:9px;

    margin-bottom:18px;

    text-align:center;

    background:rgba(34,197,94,.12);

    color:#4ade80;
}

.error{

    padding:12px;

    border-radius:9px;

    margin-bottom:18px;

    text-align:center;

    background:rgba(239,68,68,.12);

    color:#f87171;
}

.buttons{

    display:flex;

    gap:12px;

    margin-top:25px;
}

button,
.back{

    flex:1;

    padding:13px;

    border-radius:10px;

    font-weight:bold;

    text-align:center;

    text-decoration:none;

    cursor:pointer;

}

button{

    border:none;

    background:#38bdf8;

    color:#0f172a;
}

button:hover{

    background:#0ea5e9;

    color:white;
}

.back{

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.15);

    color:white;
}

.back:hover{

    background:rgba(255,255,255,.15);
}

@media(max-width:500px){

    .card{

        padding:23px;
    }

    .buttons{

        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="title">

<div class="title-icon">

🔐

</div>

<h1>Change Password</h1>

<p>Update your employee account password</p>

</div>


{% if message %}

<div class="message">

{{ message }}

</div>

{% endif %}


{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}


<form method="POST">

{% csrf_token %}


<div class="form-group">

<label>Current Password</label>

<input
type="password"
name="current_password"
placeholder="Enter current password"
required>

</div>


<div class="form-group">

<label>New Password</label>

<input
type="password"
name="new_password"
placeholder="Enter new password"
required>

</div>


<div class="form-group">

<label>Confirm New Password</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm new password"
required>

</div>


<div class="buttons">

<button type="submit">

Change Password

</button>


<a
href="{% url 'employee_home' %}"
class="back">

Back

</a>

</div>


</form>

</div>

</div>

</body>

</html>
