<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Attendance</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        rgba(15,23,42,.85),
        rgba(15,23,42,.94)
    ),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600")
    center/cover fixed no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;

}


/* CARD */

.attendance-card{

    width:720px;
    max-width:100%;

    background:rgba(255,255,255,.11);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.45);

    animation:showCard .6s ease;

}


/* HEADER */

.attendance-header{

    text-align:center;

    margin-bottom:30px;

}

.attendance-icon{

    width:85px;
    height:85px;

    margin:0 auto 18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #f59e0b,
        #d97706
    );

    color:white;

    font-size:38px;

    box-shadow:
    0 0 30px rgba(245,158,11,.35);

}

.attendance-header h1{

    color:white;

    font-size:32px;

    margin-bottom:8px;

}

.attendance-header p{

    color:#cbd5e1;

}


/* CURRENT EMPLOYEE */

.employee-info{

    display:flex;

    align-items:center;

    gap:15px;

    padding:16px;

    margin-bottom:25px;

    border-radius:14px;

    background:rgba(56,189,248,.10);

    border:1px solid rgba(56,189,248,.18);

}

.employee-icon{

    width:50px;
    height:50px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(56,189,248,.18);

    color:#38bdf8;

    font-size:21px;

}

.employee-info h3{

    color:white;

    margin-bottom:4px;

}

.employee-info p{

    color:#cbd5e1;

    font-size:14px;

}


/* FORM */

.form-group{

    margin-bottom:21px;

}

.form-group label{

    display:block;

    color:white;

    font-weight:600;

    margin-bottom:8px;

}

.input-box{

    position:relative;

}

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#38bdf8;

    z-index:2;

}

.input-box input,
.input-box select,
.input-box textarea{

    width:100%;

    padding:14px 15px 14px 45px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.10);

    color:white;

    border:1px solid rgba(255,255,255,.12);

    font-size:15px;

    transition:.3s;

}

.input-box textarea{

    min-height:110px;

    resize:vertical;

}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus{

    border-color:#38bdf8;

    box-shadow:
    0 0 15px rgba(56,189,248,.25);

    background:rgba(255,255,255,.15);

}

select option{

    background:white;
    color:#111827;

}


/* STATUS */

.status-title{

    color:white;

    font-weight:600;

    margin-bottom:10px;

}

.status-options{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;

}

.status-option{

    position:relative;

}

.status-option input{

    position:absolute;

    opacity:0;

}

.status-option label{

    display:block;

    text-align:center;

    padding:13px 8px;

    border-radius:10px;

    cursor:pointer;

    color:white;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    transition:.3s;

}

.status-option input:checked + label{

    background:#38bdf8;

    color:#0f172a;

    border-color:#38bdf8;

    font-weight:bold;

}


/* BUTTONS */

.buttons{

    display:flex;

    gap:15px;

    margin-top:30px;

}

.btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:12px;

    text-decoration:none;

    text-align:center;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.update-btn{

    background:#38bdf8;

    color:#0f172a;

}

.update-btn:hover{

    background:#0ea5e9;

    color:white;

    transform:translateY(-2px);

}

.back-btn{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.18);

}

.back-btn:hover{

    background:rgba(255,255,255,.20);

    transform:translateY(-2px);

}


/* ANIMATION */

@keyframes showCard{

    from{

        opacity:0;
        transform:translateY(30px) scale(.97);

    }

    to{

        opacity:1;
        transform:translateY(0) scale(1);

    }

}


/* MOBILE */

@media(max-width:650px){

    .attendance-card{

        padding:25px;

    }

    .status-options{

        grid-template-columns:1fr;

    }

    .buttons{

        flex-direction:column;

    }

    .attendance-header h1{

        font-size:27px;

    }

}

</style>

</head>

<body>


<div class="attendance-card">


<!-- HEADER -->

<div class="attendance-header">

<div class="attendance-icon">

<i class="fa-solid fa-pen-to-square"></i>

</div>

<h1>Update Attendance</h1>

<p>Modify employee attendance record</p>

</div>


<!-- EMPLOYEE INFO -->

<div class="employee-info">

<div class="employee-icon">

<i class="fa-solid fa-user"></i>

</div>

<div>

<h3>
{{ attendance.employee.name }}
</h3>

<p>
Attendance Record
</p>

</div>

</div>


<!-- FORM -->

<form method="POST">

{% csrf_token %}


<!-- EMPLOYEE -->

<div class="form-group">

<label>Employee</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<select name="employee" required>

{% for employee in employees %}

<option
value="{{ employee.id }}"
{% if employee.id == attendance.employee.id %}selected{% endif %}>

{{ employee.name }}

</option>

{% endfor %}

</select>

</div>

</div>


<!-- DATE -->

<div class="form-group">

<label>Attendance Date</label>

<div class="input-box">

<i class="fa-solid fa-calendar-days"></i>

<input
type="date"
name="date"
value="{{ attendance.date|date:'Y-m-d' }}"
required>

</div>

</div>


<!-- STATUS -->

<div class="form-group">

<div class="status-title">
Attendance Status
</div>

<div class="status-options">


<div class="status-option">

<input
type="radio"
name="status"
value="Present"
id="present"
{% if attendance.status == "Present" %}checked{% endif %}
required>

<label for="present">

<i class="fa-solid fa-circle-check"></i>

Present

</label>

</div>


<div class="status-option">

<input
type="radio"
name="status"
value="Absent"
id="absent"
{% if attendance.status == "Absent" %}checked{% endif %}>

<label for="absent">

<i class="fa-solid fa-circle-xmark"></i>

Absent

</label>

</div>


<div class="status-option">

<input
type="radio"
name="status"
value="Half Day"
id="halfday"
{% if attendance.status == "Half Day" %}checked{% endif %}>

<label for="halfday">

<i class="fa-solid fa-circle-half-stroke"></i>

Half Day

</label>

</div>


</div>

</div>


<!-- REMARKS -->

<div class="form-group">

<label>Remarks</label>

<div class="input-box">

<i class="fa-solid fa-comment"></i>

<textarea
name="remarks"
placeholder="Enter remarks">{{ attendance.remarks }}</textarea>

</div>

</div>


<!-- BUTTONS -->

<div class="buttons">

<button
type="submit"
class="btn update-btn">

<i class="fa-solid fa-floppy-disk"></i>

&nbsp; Update Attendance

</button>


<a
href="{% url 'view_attendance' %}"
class="btn back-btn">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Back

</a>

</div>


</form>


</div>


</body>
</html>
