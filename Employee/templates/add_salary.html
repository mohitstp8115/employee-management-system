<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Salary</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;

    background:
    linear-gradient(rgba(15,23,42,.84),rgba(15,23,42,.92)),
    url("https://images.unsplash.com/photo-1556761175-b413da4baf72?w=1600")
    center/cover fixed no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;
}

/* CARD */

.salary-card{

    width:700px;
    max-width:100%;

    background:rgba(255,255,255,.11);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.17);

    border-radius:25px;

    padding:40px;

    box-shadow:0 25px 60px rgba(0,0,0,.45);

    animation:showCard .7s ease;

}

/* HEADER */

.salary-header{
    text-align:center;
    margin-bottom:35px;
}

.salary-icon{

    width:85px;
    height:85px;

    margin:0 auto 18px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #38bdf8,
        #0ea5e9
    );

    color:#0f172a;

    font-size:38px;

    box-shadow:
    0 0 30px rgba(56,189,248,.4);

}

.salary-header h1{

    color:white;
    font-size:32px;
    margin-bottom:8px;

}

.salary-header p{

    color:#cbd5e1;

}

/* FORM */

.form-group{

    margin-bottom:20px;

}

.form-group label{

    display:block;

    color:white;

    font-weight:600;

    margin-bottom:8px;

}

.input-box{

    position:relative;

}

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#38bdf8;

}

.input-box input,
.input-box select{

    width:100%;

    padding:14px 15px 14px 45px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.10);

    color:white;

    border:1px solid rgba(255,255,255,.12);

    font-size:15px;

}

.input-box input:focus,
.input-box select:focus{

    border-color:#38bdf8;

    box-shadow:0 0 15px rgba(56,189,248,.3);

}

.input-box input::placeholder{

    color:#cbd5e1;

}

select option{

    color:#111827;
    background:white;

}

/* TWO COLUMNS */

.row{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

/* TOTAL */

.total-box{

    margin-top:25px;

    padding:22px;

    border-radius:15px;

    background:rgba(34,197,94,.12);

    border:1px solid rgba(34,197,94,.25);

    text-align:center;

}

.total-box p{

    color:#cbd5e1;

    margin-bottom:7px;

}

.total-box h2{

    color:#4ade80;

    font-size:32px;

}

/* BUTTONS */

.buttons{

    display:flex;

    gap:15px;

    margin-top:30px;

}

.btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:12px;

    text-decoration:none;

    text-align:center;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.save-btn{

    background:#38bdf8;

    color:#0f172a;

}

.save-btn:hover{

    background:#0ea5e9;

    color:white;

    transform:translateY(-2px);

}

.back-btn{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.18);

}

.back-btn:hover{

    background:rgba(255,255,255,.20);

    transform:translateY(-2px);

}

/* ANIMATION */

@keyframes showCard{

    from{

        opacity:0;
        transform:translateY(30px) scale(.97);

    }

    to{

        opacity:1;
        transform:translateY(0) scale(1);

    }

}

/* MOBILE */

@media(max-width:650px){

    .salary-card{

        padding:25px;

    }

    .row{

        grid-template-columns:1fr;

    }

    .buttons{

        flex-direction:column;

    }

    .salary-header h1{

        font-size:27px;

    }

}

</style>

</head>

<body>


<div class="salary-card">


<!-- HEADER -->

<div class="salary-header">

<div class="salary-icon">

<i class="fa-solid fa-money-bill-wave"></i>

</div>

<h1>Add Employee Salary</h1>

<p>Manage salary, bonus and deductions</p>

</div>


<!-- FORM -->

<form method="POST">

{% csrf_token %}


<!-- EMPLOYEE -->

<div class="form-group">

<label>Employee</label>

<div class="input-box">

<i class="fa-solid fa-user"></i>

<select name="employee" required>

<option value="">Select Employee</option>

{% for employee in employees %}

<option value="{{ employee.id }}">

{{ employee.name }} — {{ employee.username }}

</option>

{% endfor %}

</select>

</div>

</div>


<!-- SALARY ROW -->

<div class="row">


<!-- BASIC -->

<div class="form-group">

<label>Basic Salary</label>

<div class="input-box">

<i class="fa-solid fa-indian-rupee-sign"></i>

<input
type="number"
id="basic_salary"
name="basic_salary"
placeholder="Enter basic salary"
min="0"
required>

</div>

</div>


<!-- BONUS -->

<div class="form-group">

<label>Bonus</label>

<div class="input-box">

<i class="fa-solid fa-gift"></i>

<input
type="number"
id="bonus"
name="bonus"
placeholder="Enter bonus"
min="0"
value="0">

</div>

</div>


</div>


<!-- DEDUCTION -->

<div class="form-group">

<label>Deduction</label>

<div class="input-box">

<i class="fa-solid fa-minus-circle"></i>

<input
type="number"
id="deduction"
name="deduction"
placeholder="Enter deduction"
min="0"
value="0">

</div>

</div>


<!-- TOTAL -->

<div class="total-box">

<p>Total Salary</p>

<h2>

₹ <span id="total_salary">0</span>

</h2>

</div>


<!-- HIDDEN TOTAL -->

<input
type="hidden"
name="total_salary"
id="total_salary_input">


<!-- BUTTONS -->

<div class="buttons">

<button
type="submit"
class="btn save-btn">

<i class="fa-solid fa-plus"></i>

&nbsp; Add Salary

</button>


<a
href="{% url 'salary_management' %}"
class="btn back-btn">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Back

</a>

</div>


</form>


</div>


<script>

const basicSalary =
document.getElementById("basic_salary");

const bonus =
document.getElementById("bonus");

const deduction =
document.getElementById("deduction");

const totalSalary =
document.getElementById("total_salary");

const totalInput =
document.getElementById("total_salary_input");


function calculateSalary(){

    let basic =
    Number(basicSalary.value) || 0;

    let bonusAmount =
    Number(bonus.value) || 0;

    let deductionAmount =
    Number(deduction.value) || 0;

    let total =
    basic + bonusAmount - deductionAmount;

    if(total < 0){
        total = 0;
    }

    totalSalary.innerText =
    total.toLocaleString("en-IN");

    totalInput.value = total;

}


basicSalary.addEventListener(
    "input",
    calculateSalary
);

bonus.addEventListener(
    "input",
    calculateSalary
);

deduction.addEventListener(
    "input",
    calculateSalary
);

calculateSalary();

</script>


</body>
</html>
