<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Department</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(15,23,42,.82),rgba(15,23,42,.88)),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600")
    center/cover fixed no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;

}

/* MAIN CARD */

.form-card{

    width:700px;
    max-width:100%;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:25px;

    padding:40px;

    box-shadow:
    0 25px 60px rgba(0,0,0,.45);

    animation:cardShow .7s ease;

}

/* HEADER */

.form-header{

    text-align:center;

    margin-bottom:35px;

}

.icon-box{

    width:85px;
    height:85px;

    margin:auto;
    margin-bottom:18px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #38bdf8,
        #0ea5e9
    );

    color:#0f172a;

    font-size:38px;

    box-shadow:
    0 0 30px rgba(56,189,248,.45);

}

.form-header h1{

    color:white;

    font-size:32px;

    margin-bottom:8px;

}

.form-header p{

    color:#cbd5e1;

    font-size:15px;

}

/* FORM */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:22px;

}

.input-group{

    display:flex;

    flex-direction:column;

}

.input-group.full{

    grid-column:1 / -1;

}

.input-group label{

    color:white;

    font-weight:600;

    margin-bottom:8px;

}

.input-box{

    position:relative;

}

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#38bdf8;

}

.input-box input,
.input-box textarea{

    width:100%;

    border:none;

    outline:none;

    border-radius:12px;

    padding:14px 15px 14px 45px;

    background:rgba(255,255,255,.10);

    color:white;

    border:1px solid rgba(255,255,255,.10);

    font-size:15px;

    transition:.3s;

}

.input-box textarea{

    min-height:120px;

    resize:vertical;

    padding-top:14px;

}

.input-box input::placeholder,
.input-box textarea::placeholder{

    color:#cbd5e1;

}

.input-box input:focus,
.input-box textarea:focus{

    border-color:#38bdf8;

    box-shadow:
    0 0 15px rgba(56,189,248,.25);

    background:rgba(255,255,255,.15);

}

/* BUTTONS */

.buttons{

    display:flex;

    gap:15px;

    margin-top:30px;

}

.btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:12px;

    text-decoration:none;

    text-align:center;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

}

.save-btn{

    background:#38bdf8;

    color:#0f172a;

}

.save-btn:hover{

    background:#0ea5e9;

    color:white;

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(14,165,233,.35);

}

.back-btn{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.20);

}

.back-btn:hover{

    background:rgba(255,255,255,.20);

    transform:translateY(-2px);

}

/* REQUIRED */

.required{

    color:#f87171;

}

/* ANIMATION */

@keyframes cardShow{

    from{

        opacity:0;

        transform:translateY(30px) scale(.97);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}

/* RESPONSIVE */

@media(max-width:650px){

    .form-card{

        padding:25px;

    }

    .form-grid{

        grid-template-columns:1fr;

    }

    .input-group.full{

        grid-column:auto;

    }

    .form-header h1{

        font-size:26px;

    }

    .buttons{

        flex-direction:column;

    }

}

</style>

</head>


<body>


<div class="form-card">


<!-- HEADER -->

<div class="form-header">

<div class="icon-box">

<i class="fa-solid fa-building"></i>

</div>

<h1>Add Department</h1>

<p>Create and register a new department</p>

</div>


<!-- FORM -->

<form method="POST">

{% csrf_token %}


<div class="form-grid">


<!-- DEPARTMENT NAME -->

<div class="input-group">

<label>

Department Name

<span class="required">*</span>

</label>

<div class="input-box">

<i class="fa-solid fa-building"></i>

<input
type="text"
name="department_name"
placeholder="Enter department name"
required>

</div>

</div>


<!-- DEPARTMENT CODE -->

<div class="input-group">

<label>

Department Code

<span class="required">*</span>

</label>

<div class="input-box">

<i class="fa-solid fa-hashtag"></i>

<input
type="text"
name="department_code"
placeholder="e.g. IT001"
required>

</div>

</div>


<!-- DEPARTMENT HEAD -->

<div class="input-group">

<label>

Department Head

<span class="required">*</span>

</label>

<div class="input-box">

<i class="fa-solid fa-user-tie"></i>

<input
type="text"
name="department_head"
placeholder="Enter department head"
required>

</div>

</div>


<!-- DESCRIPTION -->

<div class="input-group full">

<label>

Department Description

</label>

<div class="input-box">

<i class="fa-solid fa-align-left"></i>

<textarea
name="description"
placeholder="Enter department description"></textarea>

</div>

</div>


</div>


<!-- BUTTONS -->

<div class="buttons">


<button
type="submit"
class="btn save-btn">

<i class="fa-solid fa-plus"></i>

&nbsp; Add Department

</button>


<a
href="{% url 'department_management' %}"
class="btn back-btn">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Back

</a>


</div>


</form>


</div>


</body>
</html>
