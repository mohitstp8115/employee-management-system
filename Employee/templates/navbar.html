<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f5f7fb;
}

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(17,24,39,.96);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.container{
    width:92%;
    max-width:1300px;
    margin:auto;
    height:75px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.logo img{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;
    border:2px solid #38bdf8;
}

.logo b{
    margin-left:12px;
    color:#fff;
    font-size:25px;
    font-weight:700;
    letter-spacing:.5px;
}

.navbar ul{
    display:flex;
    align-items:center;
    gap:18px;
    list-style:none;
}

.navbar ul li{
    margin:0;
}

.navbar ul li a{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:16px;
    font-weight:500;
    transition:.35s;
    position:relative;
}

.navbar ul li a i{
    font-size:15px;
}

.navbar ul li a:hover{
    background:#38bdf8;
    color:#111827;
    transform:translateY(-2px);
}

.navbar ul li a::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:6px;
    width:0;
    height:2px;
    background:#fff;
    transform:translateX(-50%);
    transition:.3s;
}

.navbar ul li a:hover::after{
    width:60%;
}

/* Mobile */

@media(max-width:992px){

    .container{
        flex-direction:column;
        height:auto;
        padding:15px 0;
    }

    .logo{
        margin-bottom:15px;
    }

    .navbar ul{
        width:100%;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
    }

    .navbar ul li a{
        padding:10px 15px;
        font-size:15px;
    }

    .logo b{
        font-size:22px;
    }

}

@media(max-width:576px){

    .container{
        width:95%;
    }

    .navbar ul{
        flex-direction:column;
    }

    .navbar ul li{
        width:100%;
    }

    .navbar ul li a{
        justify-content:center;
        width:100%;
    }

    .logo img{
        width:45px;
        height:45px;
    }

    .logo b{
        font-size:20px;
    }

}
    </style>
</head>
<body>
    <div class="navbar">
        <div class="container">
            <a href="" class="logo">
                <img src="https://tse1.mm.bing.net/th/id/OIP.usiWK5987RN33lkxrT8CoQHaHa?r=0&w=2000&h=2000&rs=1&pid=ImgDetMain&o=7&rm=3" alt="">
                <b>Employee Record</b>
            </a>
            <ul>
                <li><a href="{% url 'home' %}"><i class="fa-solid fa-house"></i>Home</a></li>
                <!-- <li><a href="{% url 'register' %}"><i class="fa-solid fa-comment-dots"></i>Register</a></li> -->
                <li><a href="{% url 'admin_login' %}"><i class="fa-solid fa-arrow-right-to-bracket"></i>Admin Login</a></li>
                <li><a href="{% url 'employee_login' %}"><i class="fa-solid fa-arrow-right-to-bracket"></i>Employee Login</a></li>
                <li><a href="{% url 'contact' %}"><i class="fa-solid fa-address-book"></i>Contact</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
