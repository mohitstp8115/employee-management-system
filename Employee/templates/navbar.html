<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(17,24,39,.97);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.container{
    width:92%;
    max-width:1300px;
    margin:auto;
    min-height:75px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    text-decoration:none;
}

.logo img{
    width:50px;
    height:50px;
    border-radius:12px;
    object-fit:cover;
    border:2px solid #38bdf8;
}

.logo b{
    margin-left:12px;
    color:#fff;
    font-size:25px;
    font-weight:700;
}

.navbar ul{
    display:flex;
    align-items:center;
    gap:10px;
    list-style:none;
}

.navbar ul li a{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 15px;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:16px;
    font-weight:500;
    transition:.3s;
}

.navbar ul li a:hover{
    background:#38bdf8;
    color:#111827;
}

/* Hamburger button */
.menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:28px;
    cursor:pointer;
}

/* Mobile */
@media(max-width:768px){

    .container{
        width:92%;
        min-height:65px;
        flex-wrap:wrap;
    }

    .logo img{
        width:42px;
        height:42px;
    }

    .logo b{
        font-size:19px;
        margin-left:8px;
    }

    .menu-btn{
        display:block;
    }

    .navbar ul{
        display:none;
        width:100%;
        flex-direction:column;
        gap:5px;
        padding:10px 0 15px;
    }

    .navbar ul.active{
        display:flex;
    }

    .navbar ul li{
        width:100%;
    }

    .navbar ul li a{
        width:100%;
        justify-content:center;
        padding:12px;
    }
}
</style>

<div class="navbar">
    <div class="container">

        <a href="{% url 'home' %}" class="logo">
            <img src="https://tse1.mm.bing.net/th/id/OIP.usiWK5987RN33lkxrT8CoQHaHa?r=0&w=2000&h=2000&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Employee">
            <b>Employee Record</b>
        </a>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>

        <ul id="navMenu">
            <li>
                <a href="{% url 'home' %}">🏠 Home</a>
            </li>

            <li>
                <a href="{% url 'admin_login' %}">↪ Admin Login</a>
            </li>

            <li>
                <a href="{% url 'employee_login' %}">↪ Employee Login</a>
            </li>

            <li>
                <a href="{% url 'contact' %}">📇 Contact</a>
            </li>
        </ul>

    </div>
</div>

<script>
function toggleMenu(){
    document.getElementById("navMenu").classList.toggle("active");
}
</script>
