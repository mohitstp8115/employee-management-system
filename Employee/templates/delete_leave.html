<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Leave</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
    linear-gradient(
        rgba(15,23,42,.88),
        rgba(15,23,42,.95)
    ),
    url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600")
    center/cover fixed no-repeat;

}

.card{

    width:520px;
    max-width:100%;

    padding:40px;

    text-align:center;

    background:rgba(255,255,255,.11);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);

    border-radius:25px;

    box-shadow:0 25px 60px rgba(0,0,0,.45);

    animation:show .5s ease;

}

.icon{

    width:85px;
    height:85px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(239,68,68,.15);

    color:#f87171;

    font-size:38px;

}

h1{

    color:white;

    margin-bottom:12px;

}

.message{

    color:#cbd5e1;

    line-height:1.6;

}

.details{

    margin:25px 0;

    padding:20px;

    border-radius:15px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.10);

}

.details h3{

    color:white;

    margin-bottom:12px;

}

.details p{

    color:#cbd5e1;

    margin:7px;

}

.leave-type{

    color:#c4b5fd !important;

    font-weight:bold;

}

.buttons{

    display:flex;

    gap:15px;

    margin-top:25px;

}

.btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:11px;

    text-decoration:none;

    font-weight:bold;

    cursor:pointer;

    font-size:15px;

}

.delete{

    background:#ef4444;

    color:white;

}

.delete:hover{

    background:#dc2626;

}

.cancel{

    background:rgba(255,255,255,.12);

    color:white;

    border:1px solid rgba(255,255,255,.18);

}

.cancel:hover{

    background:rgba(255,255,255,.20);

}

@keyframes show{

    from{

        opacity:0;

        transform:translateY(25px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

@media(max-width:550px){

    .card{

        padding:28px 20px;

    }

    .buttons{

        flex-direction:column;

    }

}

</style>

</head>

<body>


<div class="card">


<div class="icon">

<i class="fa-solid fa-trash"></i>

</div>


<h1>Delete Leave?</h1>


<p class="message">

Are you sure you want to delete this leave record?

This action cannot be undone.

</p>


<div class="details">


<h3>

{{ leave.employee.name }}

</h3>


<p class="leave-type">

{{ leave.leave_type }}

</p>


<p>

<i class="fa-solid fa-calendar-days"></i>

{{ leave.start_date }}

&nbsp; → &nbsp;

{{ leave.end_date }}

</p>


<p>

<i class="fa-solid fa-circle-info"></i>

{{ leave.status }}

</p>


</div>


<form method="POST">

{% csrf_token %}


<div class="buttons">


<button
type="submit"
class="btn delete">

<i class="fa-solid fa-trash"></i>

&nbsp; Delete Leave

</button>


<a
href="{% url 'view_leave' %}"
class="btn cancel">

<i class="fa-solid fa-arrow-left"></i>

&nbsp; Cancel

</a>


</div>

</form>


</div>


</body>

</html>
