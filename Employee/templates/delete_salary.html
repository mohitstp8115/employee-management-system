<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Salary</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(15,23,42,.88),rgba(15,23,42,.95)),
    url("https://images.unsplash.com/photo-1556761175-b413da4baf72?w=1600")
    center/cover fixed;
}

.card{
    width:500px;
    max-width:92%;
    padding:40px;
    text-align:center;

    background:rgba(255,255,255,.10);
    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.18);
    border-radius:24px;

    box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.icon{
    width:80px;
    height:80px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(239,68,68,.15);
    color:#f87171;

    font-size:38px;
}

h1{
    color:white;
    margin-bottom:12px;
}

p{
    color:#cbd5e1;
    line-height:1.6;
}

.employee{
    margin:25px 0;
    padding:18px;

    border-radius:14px;

    background:rgba(255,255,255,.08);
}

.employee strong{
    color:white;
    font-size:18px;
}

.salary{
    color:#4ade80;
    font-size:20px;
    font-weight:bold;
    margin-top:8px;
}

.buttons{
    display:flex;
    gap:15px;
    margin-top:25px;
}

button,
a{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    text-decoration:none;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
}

.delete{
    background:#ef4444;
    color:white;
}

.delete:hover{
    background:#dc2626;
}

.back{
    background:rgba(255,255,255,.12);
    color:white;
}

.back:hover{
    background:rgba(255,255,255,.20);
}

@media(max-width:550px){

    .card{
        padding:28px 20px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="card">

<div class="icon">
    🗑️
</div>

<h1>Delete Salary?</h1>

<p>
Are you sure you want to delete this salary record?
This action cannot be undone.
</p>

<div class="employee">

<strong>
{{ salary.employee.name }}
</strong>

<div class="salary">
₹{{ salary.total_salary }}
</div>

</div>

<form method="POST">

{% csrf_token %}

<div class="buttons">

<button type="submit" class="delete">
    Delete Salary
</button>

<a href="{% url 'view_salary' %}" class="back">
    Cancel
</a>

</div>

</form>

</div>

</body>
</html>
