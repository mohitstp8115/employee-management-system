<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:url("https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=1800&auto=format&fit=crop") center/cover fixed;
}

body::before{
content:"";
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(15,23,42,.75);
z-index:-1;
}

.header{
background:#111827;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.header h1{
font-size:30px;
}

.logout{
text-decoration:none;
background:#38bdf8;
padding:10px 22px;
border-radius:8px;
font-weight:bold;
color:#111827;
transition:.3s;
}

.logout:hover{
background:#0ea5e9;
color:white;
}

.dashboard{
width:90%;
max-width:1200px;
margin:40px auto;
}

.welcome{
background:rgba(255,255,255,.12);
backdrop-filter:blur(14px);
border-radius:18px;
padding:30px;
color:white;
margin-bottom:35px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.welcome h2{
font-size:35px;
margin-bottom:10px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:rgba(255,255,255,.12);
backdrop-filter:blur(12px);
border-radius:18px;
padding:30px;
text-align:center;
transition:.3s;
color:white;
}

.card:hover{
transform:translateY(-10px);
background:#38bdf8;
color:#111827;
}

.card i{
font-size:50px;
margin-bottom:18px;
}

.card h3{
margin-bottom:15px;
font-size:24px;
}

.card a{
display:inline-block;
margin-top:15px;
padding:10px 22px;
background:white;
color:#111827;
text-decoration:none;
border-radius:8px;
font-weight:bold;
transition:.3s;
}

.card a:hover{
background:#111827;
color:white;
}

</style>
</head>

<body>

<div class="header">

<h1>Employee Dashboard</h1>

<a href="{% url 'logout' %}" class="logout">
<i class="fa-solid fa-right-from-bracket"></i>
 Logout
</a>

</div>

<div class="dashboard">

<div class="welcome">

<h2>Welcome Employee 👋</h2>

<p>Manage your profile, salary, attendance and leave records from one dashboard.</p>

</div>

<div class="cards">

<div class="card">
<i class="fa-solid fa-user"></i>
<h3>My Profile</h3>
<a href="{% url 'my_profile' %}">Open</a>
</div>

<div class="card">
<i class="fa-solid fa-money-check-dollar"></i>
<h3>Salary</h3>
<a href="{% url 'salary' %}">Open</a>
</div>

<div class="card">
<i class="fa-solid fa-calendar-check"></i>
<h3>Attendance</h3>
<a href="{% url 'employee_attendance' %}">Open</a>
</div>
<div class="card">
<i class="fa-solid fa-calendar-days"></i>
<h3>Leave</h3>
<a href="{% url 'employee_leave' %}">Open</a>
</div>

<div class="card">
<i class="fa-solid fa-key"></i>
<h3>Change Password</h3>
<a href="{% url 'employee_change_password' %}">Open</a>
</div>

<div class="card">
<i class="fa-solid fa-file-lines"></i>
<h3>Documents</h3>
<a href="{% url 'employee_documents' %}">Open</a>
</div>

<div class="card">
<i class="fa-solid fa-bell"></i>
<h3>Notifications</h3>
<a href="{% url 'employee_notifications' %}">Open</a>
</div>


<div class="card">
<i class="fa-solid fa-headset"></i>
<h3>Support</h3>
<a href="{% url 'employee_support' %}">Open</a>
</div>

</div>

</div>

<style>

@media(max-width:768px){

.header{
flex-direction:column;
gap:15px;
text-align:center;
}

.header h1{
font-size:24px;
}

.welcome h2{
font-size:28px;
}

.card{
padding:25px;
}

.card i{
font-size:42px;
}

}

@media(max-width:480px){

.dashboard{
width:95%;
}

.welcome{
padding:20px;
}

.welcome h2{
font-size:24px;
}

.card h3{
font-size:20px;
}

.logout{
width:100%;
text-align:center;
}

}

</style>


{% include 'footer.html' %}

</body>
</html>
